{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <div class="meta">
    {{ with .Date }}{{ time.Format "2006-01-02" . }}{{ end }}
    {{ with .Params.tags }} · {{ range . }}<a href="{{ (print "/tags/" (urlize .)) | relURL }}">#{{ . }}</a> {{ end }}{{ end }}
    {{ if gt .ReadingTime 0 }} · {{ .ReadingTime }}분{{ end }}
  </div>
  {{ .Content }}
</article>
{{ end }}
