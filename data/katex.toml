# 커스텀 LaTeX 매크로
#
# Obsidian 노트에서 쓰는 비표준 명령을 여기에 정의한다. KaTeX 기본에 없는 명령을
# 노트가 쓰면 빌드가 실패하므로(= 표기 오류를 조용히 넘기지 않고 잡아준다),
# 새 매크로를 쓰기 시작할 때마다 여기에 한 줄 추가하면 된다.
#
# hugo.toml 의 [params] 가 아니라 data 파일에 두는 이유: Hugo 는 config 의
# 파라미터 키를 소문자로 정규화해서 '\V' 가 '\v' 로 바뀌어 매칭에 실패한다.
# data 파일의 키는 대소문자가 보존된다.
#
# 키·값 모두 TOML 리터럴 문자열('')이라 백슬래시를 이스케이프 없이 쓴다.

[macros]
  # body twist (Ch3 Fig 3.2 캡션 등)
  '\V' = '\mathcal{V}'
